<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nexus Research AI — four-agent research crew, rebuilt as a React + Vite preview." />
    <title>Nexus Research AI — React Preview</title>
    <!-- Set the theme before first paint: saved choice wins, otherwise the
         OS preference; dark is the default. Avoids a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem("nexus-theme");
          var theme =
            saved === "dark" || saved === "light"
              ? saved
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
